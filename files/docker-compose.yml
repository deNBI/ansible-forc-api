services:
  forc:
    image: oci.bi.denbi.de/simplevm/forc:refactor-docker
    container_name: forc
    env_file:
      - .env # envs for openresty
    volumes:
      - /var/forc/backend_path/:/var/forc/backend_path/:rw # for persistence should be mounted
      - /etc/letsencrypt/:/etc/letsencrypt/:r #needs to provided for cert
    ports:
      - 0.0.0.0:5000:5000
      - 0.0.0.0:80:80
      - 0.0.0.0:443:443
